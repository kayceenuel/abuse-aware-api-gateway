<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" style="background:#ffffff;font-family:sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── CLIENT ── -->
  <rect x="140" y="20" width="210" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-size="14" font-weight="600" x="245" y="40" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Client</text>
  <text font-size="11" x="245" y="57" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">API key + IP address</text>
  <line x1="245" y1="68" x2="245" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── SYNCHRONOUS LANE ── -->
  <rect x="30" y="104" width="440" height="280" rx="12" fill="none" stroke="#534AB7" stroke-width="0.9" stroke-dasharray="7 4"/>
  <text font-size="12" font-weight="600" x="44" y="121" text-anchor="start" fill="#534AB7">Synchronous request path — Gateway (:2121)</text>

  <rect x="55" y="130" width="380" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="245" y="147" text-anchor="middle" dominant-baseline="central" fill="#26215C">1. Auth</text>
  <text font-size="11" x="245" y="163" text-anchor="middle" dominant-baseline="central" fill="#534AB7">X-API-Key header — 401 if missing</text>

  <line x1="245" y1="174" x2="245" y2="182" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="186" width="380" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="245" y="203" text-anchor="middle" dominant-baseline="central" fill="#26215C">2. Risk check</text>
  <text font-size="11" x="245" y="219" text-anchor="middle" dominant-baseline="central" fill="#534AB7">limit:&lt;ip&gt; present? — 429 “detected abuse”</text>

  <line x1="245" y1="230" x2="245" y2="238" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="242" width="380" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="245" y="259" text-anchor="middle" dominant-baseline="central" fill="#04342C">3. Rate limits</text>
  <text font-size="11" x="245" y="275" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">token bucket (per API key) + sliding window (per IP) — 429</text>

  <line x1="245" y1="286" x2="245" y2="294" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="298" width="380" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="245" y="315" text-anchor="middle" dominant-baseline="central" fill="#26215C">4. Reverse proxy</text>
  <text font-size="11" x="245" y="331" text-anchor="middle" dominant-baseline="central" fill="#534AB7">forward the request if every check passed</text>

  <line x1="245" y1="342" x2="245" y2="418" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-size="11" x="255" y="382" text-anchor="start" fill="#5F5E5A">request / response</text>

  <rect x="105" y="420" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="245" y="438" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Fake product API (:8080)</text>
  <text font-size="11" x="245" y="455" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">/login · /search · /purchase</text>

  <!-- ── ASYNCHRONOUS LANE ── -->
  <rect x="510" y="104" width="370" height="280" rx="12" fill="none" stroke="#993C1D" stroke-width="0.9" stroke-dasharray="7 4"/>
  <text font-size="12" font-weight="600" x="524" y="121" text-anchor="start" fill="#993C1D">Asynchronous detection — Kafka pipeline</text>

  <rect x="545" y="130" width="300" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="695" y="147" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Kafka producer</text>
  <text font-size="11" x="695" y="163" text-anchor="middle" dominant-baseline="central" fill="#993C1D">publish RequestEvent on every request</text>

  <line x1="695" y1="174" x2="695" y2="182" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="545" y="186" width="300" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="695" y="203" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Kafka topic</text>
  <text font-size="11" x="695" y="219" text-anchor="middle" dominant-baseline="central" fill="#993C1D">gateway_events</text>

  <line x1="695" y1="230" x2="695" y2="238" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="545" y="242" width="300" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="695" y="259" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Kafka consumer</text>
  <text font-size="11" x="695" y="275" text-anchor="middle" dominant-baseline="central" fill="#993C1D">reads events in the background</text>

  <line x1="695" y1="286" x2="695" y2="294" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="545" y="298" width="300" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-size="13" font-weight="600" x="695" y="315" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Risk scorer</text>
  <text font-size="11" x="695" y="331" text-anchor="middle" dominant-baseline="central" fill="#993C1D">+2 new username · +1 search · threshold 10</text>

  <!-- gateway → kafka producer -->
  <line x1="470" y1="152" x2="545" y2="152" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-size="11" x="507" y="144" text-anchor="middle" fill="#5F5E5A">event</text>

  <!-- ── SHARED REDIS ── -->
  <rect x="310" y="560" width="280" height="58" rx="8" fill="#FFF4D6" stroke="#B7791F" stroke-width="0.6"/>
  <text font-size="14" font-weight="600" x="450" y="580" text-anchor="middle" dominant-baseline="central" fill="#5C4813">Redis (shared)</text>
  <text font-size="11" x="450" y="600" text-anchor="middle" dominant-baseline="central" fill="#7A5C0E">rate-limit counters · risk flags (risk:&lt;ip&gt;, limit:&lt;ip&gt;)</text>

  <!-- rate limits → redis -->
  <path d="M245 286 L245 589 L310 589" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-size="11" x="150" y="470" text-anchor="middle" fill="#0F6E56">counters</text>

  <!-- risk scorer → redis -->
  <path d="M695 342 L695 589 L590 589" fill="none" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-size="11" x="700" y="470" text-anchor="middle" fill="#993C1D">SET limit:&lt;ip&gt;</text>

  <!-- redis → risk check (feedback, affects subsequent requests) -->
  <path d="M450 560 L450 208 L435 208" fill="none" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text font-size="11" x="470" y="400" text-anchor="start" fill="#D85A30">flag read on later requests</text>

  <!-- ── LEGEND ── -->
  <line x1="60" y1="680" x2="120" y2="680" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-size="11" x="128" y="684" fill="#5F5E5A">sync request / data flow</text>

  <line x1="320" y1="680" x2="380" y2="680" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text font-size="11" x="388" y="684" fill="#5F5E5A">risk flag feed-back (affects subsequent requests)</text>

  <rect x="60" y="700" width="12" height="12" rx="2" fill="#FFF4D6" stroke="#B7791F" stroke-width="0.5"/>
  <text font-size="11" x="78" y="710" fill="#5F5E5A">Redis — shared by rate limiting and risk detection</text>
</svg>
